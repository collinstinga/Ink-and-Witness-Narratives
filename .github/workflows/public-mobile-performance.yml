name: Public mobile performance

# Read-only audit of the public homepage, not a deployment or payment test.
# No cloud credentials, browser accounts, repository write access or secrets.
on:
  push:
    branches: [feature/literary-circle-upgrade]
    paths:
      - .github/workflows/public-mobile-performance.yml
      - scripts/public-mobile-audit.mjs
      - scripts/public-mobile-audit.check.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mobile-performance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the audit code without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24.22.1'
      - name: Verify audit safety and summary calculations
        run: node --test scripts/public-mobile-audit.check.mjs
      - name: Measure the current public homepage three times
        run: node scripts/public-mobile-audit.mjs
      - name: Preserve public reports briefly
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: public-mobile-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-reports/*.json
          if-no-files-found: ignore
          retention-days: 7
