name: Literary Circle verification

# Verification only. This workflow has no deployment, cloud credentials,
# customer data, provider keys, or permission to modify repository contents.
on:
  push:
    branches: [feature/literary-circle-upgrade, feat/chaptered-books-20261028]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: literary-circle-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24.22.1'
      - name: Install the pinned package manager
        run: npm install --global pnpm@10.30.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all source types
        run: pnpm exec tsc --noEmit --pretty false
      - name: Run the complete serial regression suite
        run: pnpm exec vitest run --pool=threads --maxWorkers=1 --testTimeout=30000 --reporter=dot --silent
      - name: Build frontend and server
        id: build
        run: pnpm run build
      - name: Install matching managed Chromium and verify three fresh launches
        id: browser_setup
        timeout-minutes: 6
        env:
          PLAYWRIGHT_TEST_RUNTIME: ${{ runner.temp }}/ink-witness-browser-qa
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ink-witness-browsers
        run: |
          set -euo pipefail
          # Runner context is available at step scope, not job.env. Persist only
          # these controlled directory paths for the subsequent synthetic suites.
          echo "PLAYWRIGHT_TEST_RUNTIME=$PLAYWRIGHT_TEST_RUNTIME" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p data/ci-browser-qa
          npm install --prefix "$PLAYWRIGHT_TEST_RUNTIME" --no-audit --no-fund --ignore-scripts --no-package-lock playwright@1.62.1
          node "$PLAYWRIGHT_TEST_RUNTIME/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          node scripts/qa/browser-runtime.cjs 2>&1 | tee data/ci-browser-qa/preflight.log
      - name: Verify financial controls on mobile and desktop with synthetic API only
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.browser_setup.conclusion == 'success' }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/qa/financial-controls.cjs 2>&1 | tee data/ci-browser-qa/financial-controls.log
      - name: Verify writer recovery form and panel with synthetic services only
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.browser_setup.conclusion == 'success' }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/qa/writer-security.cjs 2>&1 | tee data/ci-browser-qa/writer-security.log
      - name: Verify chapter books and formatting on mobile and desktop with synthetic services only
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.browser_setup.conclusion == 'success' }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/qa/chapter-books.cjs 2>&1 | tee data/ci-browser-qa/chapter-books.log
      - name: Verify reader accounts, moderated comments and off-site payout receipts
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && steps.browser_setup.conclusion == 'success' }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node scripts/qa/reader-controls.cjs 2>&1 | tee data/ci-browser-qa/reader-controls.log
      - name: Preserve synthetic browser proof and failure diagnostics
        if: ${{ !cancelled() && steps.browser_setup.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: synthetic-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            data/ci-browser-qa/*.json
            data/ci-browser-qa/*.log
            data/financial-controls-qa/*.json
            data/financial-controls-qa/*.png
            data/writer-security-qa/*.json
            data/writer-security-qa/*.png
            data/chapter-books-qa/*.json
            data/chapter-books-qa/*.png
            data/reader-controls-qa/*.json
            data/reader-controls-qa/*.png
