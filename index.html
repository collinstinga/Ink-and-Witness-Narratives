    <!-- Sandbox & Dev WebSocket / Rejection Guard -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var originalError = console.error;
          var originalWarn = console.warn;
          var isBenignViteWs = function(args) {
            try {
              var str = Array.prototype.slice.call(args).map(function(a) {
                return (a && (a.message || a.stack || a.toString())) || String(a);
              }).join(' ');
              return (
                str.indexOf('[vite] failed to connect to websocket') !== -1 ||
                str.indexOf('[vite] server connection lost') !== -1 ||
                str.indexOf('WebSocket closed without opened') !== -1 ||
                str.indexOf('closed without being opened') !== -1
              );
            } catch (e) {
              return false;
            }
          };
          console.error = function() {
            if (isBenignViteWs(arguments)) return;
            return originalError.apply(console, arguments);
          };
          console.warn = function() {
            if (isBenignViteWs(arguments)) return;
            return originalWarn.apply(console, arguments);
          };
          window.addEventListener('unhandledrejection', function(event) {
            var reasonStr = String(event.reason && (event.reason.message || event.reason) || '');
            if (
              reasonStr.indexOf('WebSocket') !== -1 ||
              reasonStr.indexOf('websocket') !== -1 ||
              reasonStr.indexOf('vite') !== -1 ||
              reasonStr.indexOf('closed without being opened') !== -1 ||
              reasonStr.indexOf('failed to connect') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
          window.addEventListener('error', function(event) {
            var errorStr = String(event.message || event.error || '');
            if (
              errorStr.indexOf('WebSocket') !== -1 ||
              errorStr.indexOf('websocket') !== -1 ||
              errorStr.indexOf('vite') !== -1 ||
              errorStr.indexOf('closed without being opened') !== -1 ||
              errorStr.indexOf('failed to connect') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
        }
      })();
    </script>
